<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Website</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
<nav class="navbar">
    <div class="img-1">
        <img src="img.png/removedbackground-logo.png" alt="logo">
    </div>

    <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">Shop</a></li>
        <li><a href="#">Inventory</a></li>
    </ul>

    <div class="img-2">
        <img src="img.png/removedbackground-cart.png" alt="cart">
    </div>
</nav>

<section class="hero">
  <div class="hero-container">
    <div class="image-frame">
      <img src="img.png/darks souls 1 first.jpg" alt="Oyun 1">
      <img src="img.png/bloodborne first.avif" alt="Oyun 2">
      <img src="img.png/elden ring fist.avif" alt="Oyun 3">
    </div>
  </div>
</section>

<section class="hero">
  <div class="image-frame">
    <div class="game-card">
      <div class="game-info">
        <h3>Dark Souls</h3>
        <p class="release-date">Release Date: 2011</p>
        <p class="price">24.99 $</p>
      </div>
    </div>

    <div class="game-card">
      <div class="game-info">
        <h3>Bloodborne</h3>
        <p class="release-date">Release Date: 2015</p>
        <p class="price">19.99 $</p>
      </div>
    </div>

    <div class="game-card">
      <div class="game-info">
        <h3>Elden Ring</h3>
        <p class="release-date">Release Date: 2022</p>
        <p class="price">59.99 $</p>
      </div>
    </div>
  </div>
</section>

</body>
</html>
